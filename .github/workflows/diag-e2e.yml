name: Diag e2e
on:
  push:
    branches: [ci/diag-e2e]
permissions:
  contents: read
jobs:
  diag:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: src/frontend
    env:
      E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Variants of the Playwright start (each with its own timeout)
        run: |
          $node = (Get-Command node).Source
          $cli = Join-Path (Get-Location) 'node_modules\@playwright\test\cli.js'
          function Run($label, $argList, $secs, $dbg) {
            Write-Host "=== $label (DEBUG=$dbg)"
            if ($dbg) { $env:DEBUG = $dbg } else { Remove-Item env:DEBUG -ErrorAction SilentlyContinue }
            $o = Join-Path $env:RUNNER_TEMP "$label.out"; $e = Join-Path $env:RUNNER_TEMP "$label.err"
            Remove-Item $o, $e -ErrorAction SilentlyContinue
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $node -ArgumentList $argList -PassThru -WindowStyle Hidden -RedirectStandardOutput $o -RedirectStandardError $e
            $fin = $p.WaitForExit($secs * 1000)
            if (-not $fin) { Write-Host "TIMEOUT after $secs s"; Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'playwright|vite|chrome' } | ForEach-Object { Write-Host ("  proc {0} <- {1} {2} {3}" -f $_.ProcessId, $_.ParentProcessId, $_.Name, $_.CommandLine.Substring(0, [Math]::Min(120, $_.CommandLine.Length))) }; taskkill /T /F /PID $p.Id | Out-Null }
            $p.WaitForExit()
            Write-Host ("finished={0} exit={1} after {2:n1}s" -f $fin, $p.ExitCode, $sw.Elapsed.TotalSeconds)
            Write-Host '--- stdout (last 25)'; Get-Content $o -ErrorAction SilentlyContinue | Select-Object -Last 25
            Write-Host '--- stderr (last 10)'; Get-Content $e -ErrorAction SilentlyContinue | Select-Object -Last 10
          }
          Run 'A-exact-step' @($cli, 'test', '--reporter=list') 110 'pw:webserver'
          Run 'B-no-debug' @($cli, 'test', '--reporter=list') 110 $null
          Run 'C-debug-all' @($cli, 'test', '--reporter=list') 110 'pw:*'
          Run 'D-one-test' @($cli, 'test', '--reporter=list', '-g', 'static bundle') 110 'pw:webserver'
