name: Backend

on:
  push:
    branches: [main]
  pull_request:
    paths: ["src/backend/**", "tests/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/backend/Hasm.slnx
      - run: dotnet build src/backend/Hasm.slnx --no-restore --configuration Release
      - run: dotnet test src/backend/Hasm.slnx --no-build --configuration Release

  postgres-integration:
    # Real PostgreSQL integration tests against an ephemeral service container (destroyed with the job).
    # Nothing here touches production or customer data; see docs/DEVELOPMENT.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway bootstrap superuser of an ephemeral, job-local container; used only to create the
          # restricted test role below. Not a real secret and unreachable outside this runner.
          POSTGRES_USER: ci_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HASM_REQUIRE_PG_TESTS: "1"                                      # a closed gate FAILS, never skips
      HASM_TEST_PG_DISPOSABLE: yes-this-server-is-disposable           # explicit disposable-server acknowledgement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create restricted test-only database role
        run: |
          set -euo pipefail
          psql --version
          TEST_PW="$(openssl rand -hex 24)"
          echo "::add-mask::${TEST_PW}"
          # Minimum privileges to create/drop its own temporary databases: no superuser, role, or replication rights.
          PGPASSWORD=ci-bootstrap-throwaway psql -h localhost -U ci_bootstrap -d postgres -v ON_ERROR_STOP=1 -v pw="${TEST_PW}" <<'SQL'
          CREATE ROLE hasm_test_admin LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION PASSWORD :'pw';
          SQL
          # The container has no TLS; non-TLS is confined to this disposable loopback service (see DEVELOPMENT.md).
          echo "HASM_TEST_PG_ADMIN_CONNECTION=Host=localhost;Port=5432;Username=hasm_test_admin;Password=${TEST_PW};Database=postgres;SSL Mode=Disable" >> "$GITHUB_ENV"

      - run: dotnet restore src/backend/Hasm.slnx
      - run: dotnet build src/backend/Hasm.slnx --no-restore --configuration Release

      - name: Run PostgreSQL integration tests
        run: >
          dotnet test tests/integration/Hasm.Database.IntegrationTests
          --no-build --configuration Release
          --logger "trx;LogFileName=pg-integration.trx"
          --results-directory "$RUNNER_TEMP/trx"

      - name: Verify all 275 PostgreSQL tests executed and passed (none skipped)
        run: |
          python3 - "$RUNNER_TEMP/trx/pg-integration.trx" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          # Exact expected count per PostgreSQL test class (theory cases counted individually). A new PostgreSQL test class
          # MUST be added here, so a skipped, missing or unregistered test fails the job.
          EXPECTED = {
              "SystemDatabaseTests": 10, "CompanyProvisioningTests": 17, "IdentityMigrationTests": 8, "UserCreationTests": 9,
              "LoginTests": 7, "SessionTests": 11, "BruteForceProtectionTests": 11, "AuthApiTests": 27,
              "AccessMigrationTests": 4, "MembershipTests": 8, "RoleTests": 5, "AssignmentAndScopeTests": 8,
              "AccessRevocationTests": 5, "AccessAuditTests": 2, "OfflineAdministrationTests": 3,
              "ConcurrentAccessChangeTests": 5, "AccessApiTests": 18,
              "LastAdministratorTests": 7, "AccountEnumerationTests": 2, "ScopeFailClosedTests": 3,
              "LoginAbuseProtectionTests": 10, "AdministratorContinuityTests": 16, "SecurityHardeningApiTests": 10,
              # Phase 2.3C-2 cryptographic audit integrity
              "AuditMigrationTests": 4, "AuditChainTests": 6, "AuditTamperDetectionTests": 18, "AuditAtomicityTests": 9,
              "AuditConcurrencyTests": 4, "AuditKeyRotationTests": 4, "AuditFileEvidenceTests": 8, "AuditApiTests": 3,
              "AuditAdminToolTests": 7, "AuditRecoveryTests": 6,
          }
          TOTAL = sum(EXPECTED.values())  # 275
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          counts, outcomes, unknown = {}, {}, []
          for r in ET.parse(sys.argv[1]).getroot().iterfind(".//t:UnitTestResult", ns):
              name = r.get("testName", "")
              m = re.match(r"Hasm\.Database\.IntegrationTests\.(\w+)\.", name)
              cls = m.group(1) if m else ""
              if cls == "SafetyGateTests":
                  continue  # pure logic, needs no database
              if cls not in EXPECTED:
                  unknown.append(name)
                  continue
              counts[cls] = counts.get(cls, 0) + 1
              outcomes[r.get("outcome")] = outcomes.get(r.get("outcome"), 0) + 1
          print(f"PostgreSQL tests found: {sum(counts.values())}; outcomes: {outcomes}; per class: {counts}")
          ok = counts == EXPECTED and outcomes == {"Passed": TOTAL} and not unknown
          if not ok:
              print(f"::error::Expected exactly {TOTAL} PostgreSQL tests with the per-class counts above, all Passed (none skipped/failed); unregistered classes: {unknown[:5]}")
              sys.exit(1)
          PY
