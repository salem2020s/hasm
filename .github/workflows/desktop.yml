name: Desktop

# Runs on the repository's self-hosted Windows runner (self-hosted, Windows, X64): no GitHub-hosted (and 2x-priced Windows) minutes are billed. Only code of THIS repository runs there.
on:
  push:
    branches: [main]
  pull_request:
    paths: ["src/desktop/**", "src/frontend/**", "assets/branding/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rust toolchain (stable, MSVC) via rustup in the runner account profile (the dtolnay action needs bash on PATH, which a Windows service account does not have)
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          if (-not (Test-Path (Join-Path $cargoBin 'rustup.exe'))) {
            Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile (Join-Path $env:RUNNER_TEMP 'rustup-init.exe')
            & (Join-Path $env:RUNNER_TEMP 'rustup-init.exe') -y --default-toolchain stable --profile minimal --no-modify-path
            if ($LASTEXITCODE -ne 0) { throw 'rustup-init failed' }
          }
          $cargoBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & (Join-Path $cargoBin 'rustup.exe') toolchain install stable --profile minimal
          & (Join-Path $cargoBin 'rustc.exe') --version
      - run: npm ci
        working-directory: src/frontend
      - run: npm ci
        working-directory: src/desktop
      - name: Build Tauri shell (no installer)
        run: npx tauri build --debug --no-bundle
        working-directory: src/desktop
