name: Desktop

# Runner mode (repository variable HASM_RUNNER_MODE): these jobs run on GitHub-hosted runners (the default, while free minutes remain). Set HASM_RUNNER_MODE=self-hosted to run the same checks, under the same check names,
# on the repository's self-hosted Windows runner instead (desktop-selfhosted.yml); the job of the other mode is skipped. See docs/CI-RUNNER.md.

on:
  push:
    branches: [main]
  pull_request:
    paths: ["src/desktop/**", "src/frontend/**", "assets/branding/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-build:
    if: ${{ vars.HASM_RUNNER_MODE != 'self-hosted' }}
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: src/frontend
      - run: npm ci
        working-directory: src/desktop
      - name: Build Tauri shell (no installer)
        run: npx tauri build --debug --no-bundle
        working-directory: src/desktop
