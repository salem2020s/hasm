name: Desktop

# Runs on the repository's self-hosted Windows runner (self-hosted, Windows, X64): no GitHub-hosted (and 2x-priced Windows) minutes are billed. Only code of THIS repository runs there.
on:
  push:
    branches: [main]
  pull_request:
    paths: ["src/desktop/**", "src/frontend/**", "assets/branding/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: src/frontend
      - run: npm ci
        working-directory: src/desktop
      - name: Build Tauri shell (no installer)
        run: npx tauri build --debug --no-bundle
        working-directory: src/desktop
