name: Frontend

# Runner mode (repository variable HASM_RUNNER_MODE): these jobs run on GitHub-hosted runners (the default, while free minutes remain). Set HASM_RUNNER_MODE=self-hosted to run the same checks, under the same check names,
# on the repository's self-hosted Windows runner instead (frontend-selfhosted.yml); the job of the other mode is skipped. See docs/CI-RUNNER.md.

on:
  push:
    branches: [main]
  pull_request:
    paths: ["src/frontend/**", "assets/branding/**", ".github/workflows/frontend.yml", ".github/workflows/frontend-selfhosted.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-build-test:
    if: ${{ vars.HASM_RUNNER_MODE != 'self-hosted' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e-smoke:
    if: ${{ vars.HASM_RUNNER_MODE != 'self-hosted' }}
    timeout-minutes: 30
    # Phase 4.0: browser smoke tests of the production bundle (no backend needed); full-stack E2E is a later extension.
    # Pinned: Playwright 1.56 does not support the ubuntu-latest image (ubuntu 26.04).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
